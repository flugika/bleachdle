version: 2
updates:
  - package-ecosystem: npm # covers pnpm lockfiles too
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next-and-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      dev-tooling:
        dependency-type: development
    ignore:
      # Next.js major bumps deserve a manual look, not an auto PR
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday